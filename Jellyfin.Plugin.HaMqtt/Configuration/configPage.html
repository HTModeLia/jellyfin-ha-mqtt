<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Home Assistant MQTT</title>
</head>
<body>
    <div id="HaMqttConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <h2>Home Assistant MQTT</h2>
                <p>Broker MQTT (Mosquitto de Home Assistant). Les réglages s'appliquent dans les 10 secondes, sans redémarrer Jellyfin. Hôte vide = remontée coupée.</p>
                <form id="HaMqttConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="Hote">Hôte du broker</label>
                        <input id="Hote" type="text" is="emby-input" placeholder="192.168.13.33" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="Port">Port</label>
                        <input id="Port" type="number" is="emby-input" min="1" max="65535" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="Utilisateur">Utilisateur</label>
                        <input id="Utilisateur" type="text" is="emby-input" autocomplete="off" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="MotDePasse">Mot de passe</label>
                        <input id="MotDePasse" type="password" is="emby-input" autocomplete="new-password" />
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Enregistrer</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var HaMqtt = { pluginUniqueId: 'a757374b-70ab-405b-82ad-bfb8817d3271', champs: ['Hote', 'Port', 'Utilisateur', 'MotDePasse'] };

            document.querySelector('#HaMqttConfigPage').addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(HaMqtt.pluginUniqueId).then(function (config) {
                    HaMqtt.champs.forEach(function (c) { document.querySelector('#' + c).value = config[c]; });
                    Dashboard.hideLoadingMsg();
                });
            });

            document.querySelector('#HaMqttConfigForm').addEventListener('submit', function (e) {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(HaMqtt.pluginUniqueId).then(function (config) {
                    HaMqtt.champs.forEach(function (c) { config[c] = document.querySelector('#' + c).value.trim(); });
                    config.Port = parseInt(config.Port, 10) || 1883;
                    ApiClient.updatePluginConfiguration(HaMqtt.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
                e.preventDefault();
                return false;
            });
        </script>
    </div>
</body>
</html>
